<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Server Down — Maintenance</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* Page-level layout */
    html, body {
      height: 100%;
      background: #0d1117;
      color: #e6eef8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .center-card {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card-clean {
      background: #1b4397;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      backdrop-filter: blur(6px);
      max-width: 820px;
      width: 100%;
      padding: 2.25rem;
      border-radius: 12px;
    }

    .big-icon {
      font-size: 56px;
      line-height: 1;
      color: #ffd166;
    }

    h1 {
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }

    p.lead {
      color: ##ffffff;
      opacity: 0.95;
    }

    .muted-small {
      color: #ffffff;
      font-size: 0.92rem;
    }

    .btn-retry {
      min-width: 140px;
    }

    footer.small {
      color: #7e9dbf;
      margin-top: 1.25rem;
      font-size: 0.85rem;
    }

    @media (max-width: 576px) {
      .big-icon { font-size: 44px; }
      .card-clean { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="center-card">
    <section class="card-clean">
      <div class="d-flex align-items-start gap-3">
        <div class="big-icon">
          <i class="bi bi-server"></i>
        </div>

        <div class="flex-grow-1">
          <h1>Server is down</h1>
          <p class="lead mb-2">Our website is not live at the moment — please try again later.</p>

          <p class="muted-small mb-3">
            We're aware of the issue and working to restore service as quickly as possible.
          </p>

          

        </div>
      </div>
    </section>
  </main>

  <!-- Optional: Bootstrap JS bundle (for dropdowns, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Update the "Last checked" time
    function updateCheckedTime() {
      const now = new Date();
      const fmt = now.toLocaleString();
      document.getElementById('checkedAt').textContent = fmt;
    }
    updateCheckedTime();

    // Reload button: attempt to reload the page
    document.getElementById('reloadBtn').addEventListener('click', function () {
      // Optionally you could trigger a health-check endpoint via fetch before reload.
      // For now, just reload the page.
      location.reload();
    });

    // Optional: poll a healthcheck every X seconds and update timestamp
    // (uncomment if you have a health endpoint)
    /*
    setInterval(async () => {
      try {
        const res = await fetch('/health', { cache: 'no-store' });
        // Do something with res.status or res.json()
        updateCheckedTime();
      } catch (e) {
        updateCheckedTime();
      }
    }, 30000); // every 30s
    */
  </script>
</body>
</html>
